[project]
name = "utils-lib"
version = "0.1.0"
description = "Biblioteca interna para configuração padronizada de logging (stdout/stderr)."
readme = "README.md"
authors = [
    { name = "Cesar Suchoj Fernandes", email = "cesar.suchoj@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "python-json-logger>=2.0.7",
    "opentelemetry-api>=1.22.0",
    "opentelemetry-sdk>=1.22.0",
    "opentelemetry-instrumentation-fastapi>=0.43b0",
    "pyyaml>=6.0",
    "rich>=13.0"
]

[project.scripts]
utils-lib = "utils_lib:main"

[project.optional-dependencies]
# Dependências usadas apenas para testes e CI/CD
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "httpx>=0.26.0"
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.5.1",
]

[tool.black]
line-length = 90
