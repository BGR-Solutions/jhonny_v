[project]
name = "jhonny-v-infra"
version = "0.1.0"
description = "Isolated validation tools for Jhonny-V infrastructure."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "black>=25.1",
    "mypy>=1.15",
    "pytest>=8.3",
    "PyYAML>=6.0.2",
    "ruff>=0.11",
    "types-PyYAML>=6.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: requires a working Linux Docker Engine",
    "retention: continuous physical retention qualification",
]

[tool.black]
target-version = ["py312"]

[tool.ruff]
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["tests"]
