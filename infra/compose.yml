name: ${COMPOSE_PROJECT_NAME:-jhonny-v}

x-common-environment: &common-environment
  TZ: ${TZ:-UTC}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

networks:
  jhonny-core:
    name: ${COMPOSE_PROJECT_NAME:-jhonny-v}-core
    driver: bridge

volumes:
  postgres-data:
    name: ${COMPOSE_PROJECT_NAME:-jhonny-v}-postgres-data
  redis-data:
    name: ${COMPOSE_PROJECT_NAME:-jhonny-v}-redis-data
  rabbitmq-data:
    name: ${COMPOSE_PROJECT_NAME:-jhonny-v}-rabbitmq-data
