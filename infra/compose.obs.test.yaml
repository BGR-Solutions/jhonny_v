services:
  loki:
    env_file: !override []
  logs-gateway:
    ports: !override
      - "127.0.0.1::8080"
    volumes: !override
      - type: bind
        source: ./logs-gateway/nginx.conf.template
        target: /etc/nginx/templates/nginx.conf.template
        read_only: true
      - type: volume
        source: test-secrets
        target: /run/secrets
        read_only: true
  alloy:
    env_file: !override []
    volumes: !override
      - type: bind
        source: ./alloy/config.alloy
        target: /etc/alloy/config.alloy
        read_only: true
      - type: volume
        source: test-secrets
        target: /run/secrets
        read_only: true
      - type: volume
        source: alloy-data
        target: /var/lib/alloy
  source-a: &source
    image: python:3.12.12-alpine3.22@sha256:848ba4413eb897e225159b8fc1b02094576cbae4aa73fc13142608ae2c8c0e32
    entrypoint: ["python", "-u", "-c", "import time; time.sleep(3600)"]
    tty: false
    networks: [obs-test]
    logging:
      driver: json-file
  source-b:
    <<: *source
  source-new:
    <<: *source
    profiles: [dynamic]

networks:
  obs-test:
    internal: true
volumes:
  test-secrets:
    external: true
    name: ${OBS_TEST_SECRETS_VOLUME:?Fixture-owned secret volume required}
