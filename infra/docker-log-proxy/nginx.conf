user root;
worker_processes 1;
pid /run/obs/nginx.pid;
error_log stderr warn;
events { worker_connections 256; }
http {
    log_format structured escape=json '{"level":"info","service":"docker-log-proxy","status":$status,"method":"$request_method"}';
    access_log /dev/stdout structured;
    client_body_temp_path /run/obs/client;
    proxy_temp_path /run/obs/proxy;
    map $request_method $allowed_method { default 0; GET 1; HEAD 1; }
    upstream docker_api { server unix:/var/run/docker.sock; }
    server {
        listen 2375;
        location ~ ^(/v[0-9]+\.[0-9]+)?/(_ping|version|networks|containers/json|containers/[a-f0-9]+/(json|logs))$ {
            if ($allowed_method = 0) { return 405; }
            proxy_pass http://docker_api;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_read_timeout 1h;
            proxy_set_header Connection "";
        }
        location / { return 404; }
    }
}
