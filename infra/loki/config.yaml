# Loki monolítico single-tenant. Escuta só no loopback; o acesso externo passa
# pelo gateway autenticado (loki-gateway), que compartilha o namespace de rede.
# Requer `-config.expand-env=true`.
auth_enabled: false

server:
  http_listen_address: 127.0.0.1
  http_listen_port: 3101
  grpc_listen_address: 127.0.0.1
  grpc_listen_port: 9096
  log_format: json
  log_level: ${LOKI_LOG_LEVEL:-info}

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: "2026-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

limits_config:
  retention_period: ${LOKI_RETENTION_PERIOD:-7d}
  allow_structured_metadata: true
  discover_service_name:
    - compose_service
  discover_log_levels: true
  max_line_size: 256KB
  max_line_size_truncate: true

analytics:
  reporting_enabled: false
